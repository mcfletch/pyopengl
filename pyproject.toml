[project]
name="PyOpenGL"
dynamic=["version"]
description = "Standard OpenGL bindings for Python"
authors = [
    {name="Mike C. Fletcher",email="mcfletch@vrplumber.com"},
]
readme = {file="readme.rst", content-type = "text/x-rst"}
license = "BSD-3-Clause"
license-files = ["license.txt"]
requires-python = ">=3.9"
keywords = [
    "Graphics",
    "3D",
    "OpenGL",
    "GLU",
    "GLUT",
    "GLE",
    "GLX",
    "EXT",
    "ARB",
    "Mesa",
    "ctypes",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
test = [
    "tox",
    "tox-uv >= 1",
    "pip >= 23 ; python_version >= '3.12'",
    "pytest",
    # A hang inside a test is otherwise bounded only by the CI job limit, which
    # reports a cancelled job rather than the name of what it was waiting for.
    "pytest-timeout",
    "setuptools >= 77",
    # pygame-ce is the maintained fork and the only one with wheels for the
    # interpreters the matrix runs; below 3.11 the suite uses glfw or the
    # headless backends, and the pygame windowing backend is simply absent.
    "pygame-ce >= 2.1.3; python_version >= '3.11'",
    "psutil",
    "xlib",
    "glfw",
    # tests/cdispatch reads the Khronos registry XML through src/xmlreg.py.
    "lxml",
]
dev = [
    "cython >= 0.28",
    "PyOpenGL[test]",
]

# PyInstaller reads this to find the hooks in OpenGL/__pyinstaller, which tell it
# about the plug-in registries and the Windows DLLs it cannot see by following
# import statements. Nothing is imported from that package at run time.
[project.entry-points.pyinstaller40]
hook-dirs = "OpenGL.__pyinstaller:get_hook_dirs"

[project.urls]
Homepage = "https://mcfletch.github.io/pyopengl/"
Download = "https://pypi.org/project/PyOpenGL/"
Source = "https://github.com/mcfletch/pyopengl"
Documentation = "https://mcfletch.github.io/pyopengl/documentation/index.html"

[build-system]
requires = [ "setuptools >= 77.0" ]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "OpenGL.version.__version__"}

[tool.setuptools.package-data]
# py.typed tells a type checker the package ships type information; without it
# the .pyi stubs beside the modules are ignored.
# The declarations the pure-Python path reads where no extension was built.
# The C extension holds the same facts; these are what an installation without
# a compiler has instead, so they are not optional.
# A stub per generated module as well as per API package: a friendly module
# fills its namespace from the tables at import, so the stub beside it is
# what an editor and a type checker have to read.
OpenGL = ["py.typed", "_typing.pyi", "**/*.pyi", "raw/_declarations/*.dat"]

[tool.setuptools.packages.find]
namespaces=false
include=["OpenGL*"]
exclude=["tests","accelerate","directdocs","documentation"]

[tool.pytest.ini_options]
# Where the suites are, so a bare `pytest` runs what CI runs.
testpaths = ["tests", "accelerate/tests"]

# The suites import their shared helpers by bare name -- `from arraycompat
# import np` from anywhere, `from gltestcase import GLTestCase` from within a
# suite -- and tests/cdispatch reads the build-time generator out of src/.
# Naming them here is what puts them on the path; these directories used to be
# reached by three conftest.py files editing sys.path and by pytest's prepend
# import mode adding each test file's own directory, which importlib mode
# (below) does not do.
pythonpath = ["tests", "tests/gl", "tests/gles", "tests/glu", "src"]

# importlib import mode gives each test module a name derived from its path, so
# two suites may hold the same basename: tests/gl and tests/gles cover the same
# extensions under two APIs and want to say so with the same file name. Under
# the default prepend mode a duplicate basename is a collection error, which is
# why the ES copies carried a `test_es_` prefix. There is no ini key for it,
# only the command-line option, so it goes in addopts.
addopts = "--import-mode=importlib"

# A test that hangs -- a driver waiting on a compositor that will not answer, a
# window that never maps -- otherwise runs until the CI job's own limit, which
# cancels the job and names nothing. Generous, because the point is to bound a
# hang rather than to time anything: the slowest case here builds a frozen
# application and takes about eight seconds.
timeout = 300

# An xfail that starts passing is a result, not a quiet success: say so, so the
# marker comes off in the same change that fixed it.
xfail_strict = true

filterwarnings = [
    "error",
    # setuptools reads the accelerate extension's `compiler_directives` keyword,
    # which is Cython's rather than distutils'. Raised while a test imports
    # accelerate/setup.py; the keyword is honoured by the Cython build.
    # `(?s)` because the message opens with a newline, and `.` does not match
    # one -- without it the pattern silently matches nothing and the warning is
    # still an error.
    "ignore:(?s).*Please remove unknown .Extension. options.*:UserWarning",
]

markers = [
    "performance: asserts how fast something draws, so it needs a GPU to draw it. Deselected with '-m \"not performance\"' where the renderer rasterises on the CPU -- llvmpipe answers a question about speed wrongly by three orders of magnitude.",
    "resources: asserts a budget in memory or import time rather than a result, so it measures the machine as much as the library. Deselected with '-m \"not resources\"' on a machine doing something else at the same time.",
    "slow: takes seconds rather than milliseconds, because it builds something -- a frozen application, an archive. Deselected with '-m \"not slow\"' while iterating.",
]

[tool.black]
skip-string-normalization=true

[tool.ruff.lint]
dummy-variable-rgx="^(_|err)$"
ignore = [
    'D200', # Allow multiline docstring even when it could fit on one line

    'C408', # Allow instantiating dictionary as dict(key=value)
    'E501', # Line too long
    'ANN101', # Don't require self to be annotated.
    'PTH', # allow os.path
    'PLR0913', # allow too many arguments

    # 'F841', # we often have `err` as unused argument in this codebase
    'E401', # I prefer multiple imports/line generally
    'E402', # Common pattern with autogenerated boilerplate in the wrappers
    'F401', # Unused imports from autogeneration are everywhere
    'F403', # Standard usage is to use star imports
    'F405', # Standard usage is to use star imports
    'F811', # Redefinition of function from autogen in the higher-level wrappers is common

    # 'F821', # Undefined variables due to start imports, again
    'E741', # Variables from the underlying api are often e.g. `l`

]
[tool.ruff.lint.per-file-ignores]
"OpenGL/_bytes.py" = [
    "F821",
]
"OpenGL/GL/shaders.py" = [
    "F821",
]
"OpenGL/wrapper.py" = [
    'F841', # we often have `err` as unused argument in this codebase

]
"OpenGL/GL/images.py" = [
    "F822",
]
"OpenGL/GL/pointers.py"= [
    "F822",
]
"OpenGL/Tk/__init__.py"=[
    "E701",
]

[tool.ruff.format]
quote-style = "preserve"

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in OpenGL/version.py, so name that file too: without it a version bump
# leaves uv answering with the previous number, and a dependent requiring the
# new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "OpenGL/version.py" }]
