[tox]
requires=
    tox-uv>=1
envlist=
    py{314,313,312,311,310,39}-num{0,1}-accel{0,1}-disp{ctypes,c}
    pypy{311,310}-num{0,1}-accel0-dispctypes
skip_missing_interpreters=True
[testenv]
whitelistcommands=accel.sh
usedevelop=True
passenv =
    LANG
    LANGUAGE
    DISPLAY
    HOME
    USER
    SDL_VIDEODRIVER
    XDG_RUNTIME_DIR
    XDG_SESSION_ID
    XDG_SESSION_PATH
    XDG_SESSION_TYPE
    TEST_WINDOWING
    TEST_VISIBLE

# Which implementation of the entry points to test.  Both are supported, so
# both are run: a test that passes under one and not the other is a defect in
# whichever is wrong, and there is no way to tell which without running both.
setenv=
    dispctypes: PYOPENGL_DISPATCH=ctypes
    dispc: PYOPENGL_DISPATCH=c

deps=
    -r{toxinidir}/test-requirements.txt
    num1: -r{toxinidir}/numpy-requirements.txt
    accel1: ./accelerate
#install_command = pip install -I {opts} {packages}
commands=
    accel1: python -m pytest -sv -rxXs {posargs:tests/ accelerate/tests}
    accel0: python -m pytest -sv -rxXs {posargs:tests/}
