[tox]
requires=
    tox-uv>=1
envlist=
    # The C entry points are in accelerate, so `dispc` is crossed with
    # `accel1` alone: an `accel0-dispc` cell asks for an implementation that
    # is not installed, and the suite refuses to run rather than test ctypes
    # while reporting it tested C.
    py{314,313,312,311,310,39}-num{0,1}-accel0-dispctypes
    py{314,313,312,311,310,39}-num{0,1}-accel1-disp{ctypes,c}
    pypy{311,310}-num{0,1}-accel0-dispctypes
    # The configuration flags OpenGL/__init__.py documents.  On one
    # interpreter, because a flag about array conversion is not a claim about
    # the interpreter -- but crossed with numpy and accelerate, because those
    # two are exactly what it *is* a claim about.  Crossing them with the whole
    # sweep above would multiply the matrix by the number of flags for nothing.
    py314-num{0,1}-accel{0,1}-dispctypes-flag{errorcopy,nosizecheck,nounpack}
    # Accelerate built and then switched off, which is a different
    # configuration from accelerate absent: the extension is importable, so
    # anything that decides by trying to import it answers yes and goes on
    # testing a path USE_ACCELERATE has just taken out of the picture.  Only
    # with the ctypes entry points, since turning the accelerators off turns
    # off the C layer they carry.
    py314-num1-accel1-dispctypes-useaccel0
    # The shipped stub surface.  In the list rather than called by name: a gate
    # nothing runs is a gate that stops being true, and this one is a second.
    typecheck
    # The `requires-python` floor, the names that may be unbound where they
    # are read, and the error paths a run never enters.  In the list for the
    # same reason.
    floor
    possiblyundefined
    errorpaths
skip_missing_interpreters=True
[testenv]
whitelistcommands=accel.sh
usedevelop=True
# A variable that does not reach the child does not stop the run; it renders
# with something else and reports a pass for a configuration nobody asked for.
# The graphics ones matter as much as the toolkit ones: LIBGL_ALWAYS_SOFTWARE
# unset inside the env means a run asked to use llvmpipe silently used the GPU.
passenv =
    LANG
    LANGUAGE
    DISPLAY
    WAYLAND_DISPLAY
    # DISPLAY without the cookie to open it is a display nobody may connect
    # to: a virtual server (xvfb-run) writes its own authority file and names
    # it here, and X clients that arrive without it are refused with
    # "Authorization required, but no authorization protocol specified".
    XAUTHORITY
    XAUTHLOCALHOSTNAME
    HOME
    USER
    SDL_VIDEODRIVER
    XDG_RUNTIME_DIR
    XDG_SESSION_ID
    XDG_SESSION_PATH
    XDG_SESSION_TYPE
    TEST_WINDOWING
    TEST_VISIBLE
    TEST_DWELL
    TEST_EGL_DEVICE
    TEST_CGL_RENDERER
    TEST_NO_ACCELERATE
    PYOPENGL_PLATFORM
    LIBGL_*
    MESA_*
    GALLIUM_DRIVER
    EGL_*
    DRI_*
    __GLX_*
    __NV_*
    NVIDIA_*

# Which implementation of the entry points to test.  Both are supported, so
# both are run: a test that passes under one and not the other is a defect in
# whichever is wrong, and there is no way to tell which without running both.
setenv=
    dispctypes: PYOPENGL_DISPATCH=ctypes
    dispc: PYOPENGL_DISPATCH=c
    # A caller that refuses the implicit copy PyOpenGL makes for a Python
    # sequence or a mismatched array.  The suite passes lists where a list is
    # what a caller would write, so this axis is what keeps arraycompat's
    # copy_safe/object_names honest -- and what found six entry points being
    # handed the wrong element type.
    flagerrorcopy: PYOPENGL_ERROR_ON_COPY=1
    # A caller that has turned the output-size check off for the speed.  The
    # cases that assert the refusal skip; what has to keep working is
    # everything else.
    flagnosizecheck: PYOPENGL_ARRAY_SIZE_CHECKING=0
    # The pre-3.0 shape, where a query producing one value answers with a
    # one-element array rather than the value.  Reachable from the environment
    # only from 4.0, and broken library-wide until then.
    flagnounpack: PYOPENGL_SIZE_1_ARRAY_UNPACK=0
    # The accelerators declined by a caller who has them installed.
    useaccel0: PYOPENGL_USE_ACCELERATE=0

# There is deliberately no `install_command` here.  tox-uv builds these
# environments with `uv venv` and installs into them with `uv pip install`,
# naming the uv it was loaded with; an override that spells out an installer
# replaces that, and a uv-made environment has no pip for one to call.  uv
# prefers a wheel wherever a matching one exists, which is the behaviour an
# override would have been asking for -- pygame-ce publishes wheels for every
# interpreter in the matrix, and building it from source would want SDL's
# development headers that a machine running the tests has no other reason to
# have.

# What the suite needs is declared once, as the project's `test` extra, so that
# a tox environment and `pip install PyOpenGL[test]` are the same set.
#
# accelerate pins the PyOpenGL it pairs with exactly, and between releases
# that version is in this tree and on no index -- so the two are resolved
# together, from here.  Installing accelerate on its own would ask an index for
# a version that does not exist there yet.  usedevelop replaces the first with
# the editable install afterwards.
deps=
    {toxinidir}[test]
    num1: -r{toxinidir}/numpy-requirements.txt
    accel1: {toxinidir}
    accel1: ./accelerate

# accelerate is reinstalled on every run of an accel1 environment.  tox keys a
# dependency on the text of its spec, and `./accelerate` never changes -- so an
# environment built before a version bump keeps the accelerate it has, and the
# pair check refuses it at the first entry point, in an environment nobody
# edited.  Through uv rather than pip: `requires` above makes tox-uv the
# installer, and an environment it built has no pip in it.  The install is a
# relink where nothing changed, since the object files are cached in the source
# tree.
allowlist_externals=
    uv
commands_pre=
    accel1: uv pip install --python {envpython} --no-deps --reinstall-package pyopengl-accelerate {toxinidir}/accelerate
# What a measurement of the machine is deselected here rather than by each
# caller, so that every run through tox -- a developer's and CI's alike --
# leaves out the same thing.  `performance` needs a real driver, unloaded;
# `resources` is a budget in memory that other work on the machine spends
# too.  Both still run under a bare `pytest`, and a later `-m` in posargs
# overrides this one, so asking for them back is `tox -e ... -- -m performance`.
commands=
    accel1: python -m pytest -sv -rxXs -m "not performance and not resources" {posargs:tests/ accelerate/tests}
    accel0: python -m pytest -sv -rxXs -m "not performance and not resources" {posargs:tests/}

# The shipped stub surface, checked as a user's own type checker reads it.
# `[tool.mypy]` in pyproject.toml says what is in the gate and why the
# package's own source is not; the run needs no paths because that table names
# them.
[testenv:typecheck]
skip_install = false
usedevelop = True
deps =
    mypy
    numpy
commands = mypy

# `requires-python` says 3.9, and so do the trove classifiers.  The matrix has
# a py39 row, but a row only reaches the files it imports -- a helper used on
# one platform, a branch behind a flag -- and a syntax or a standard-library
# module that arrived later is a question about the *text* that can be settled
# for every file at once, on any interpreter.
#
# What is in the gate, and what is not:
#
# * `.pyi` stubs are excluded.  A stub is read by a type checker at whatever
#   `[tool.mypy] python_version` names and is never imported, so
#   `OpenGL/_typing.pyi` may name `collections.abc.Buffer` (3.12) behind the
#   `sys.version_info` guard it already carries.
# * `src/khronosapi` and `src/eglapi` are Khronos's own repositories, fetched
#   by `src/fetch_registries.py` and not tracked here.
# * `long` and `unicode` are members of `OpenGL._bytes`, which spells them
#   `int` and `str`; vermin reads the bare names as the Python 2 builtins.
# * `tests/tomlread.py` is the one file allowed to reach for a module the two
#   lowest interpreters do not have.  It is written as a guarded import with
#   `tomli` behind it, which vermin has no backport entry for, so the file is
#   named rather than the module -- every other use of `tomllib` is still a
#   finding.
[testenv:floor]
skip_install = true
deps =
    vermin
commands =
    vermin --target=3.9- --violations --no-tips --eval-annotations \
        --exclude-regex '.*\.pyi$' \
        --exclude-regex '.*/src/(khronosapi|eglapi)/.*' \
        --exclude-regex '.*/tests/tomlread\.py$' \
        --exclude long \
        --exclude unicode \
        {posargs:OpenGL tests src accelerate}

# The `NameError` raised inside an `except` clause while reporting something
# else, and its relatives: a name the failing line never reached, a name bound
# in one branch and read in another.  mypy has an error code for exactly that
# shape and it needs none of the annotation work the main typecheck would, so
# this is a second run with one error code enabled and the rest off.
#
# `[tool.mypy]` deliberately covers the shipped stub surface alone, and says
# why: the package's own source reports around 240 findings, overwhelmingly
# mypy failing to model the dynamic dispatch layer.  None of those is this
# error code, so this run is green with the same source in front of it.
[testenv:possiblyundefined]
skip_install = true
deps =
    mypy
commands =
    python {toxinidir}/src/check_possibly_undefined.py {posargs}

# The error paths a run of the suite never enters.  An `except` clause or a
# `finally` block nothing reaches is one nothing has ever checked, and that is
# where this package keeps finding handlers that raise instead of reporting --
# a lookup outside the `try` that was meant to be inside it, a name the failing
# line never assigned, a `finally` that threw away the frame it was protecting.
#
# The suite is run once more here rather than measured in the cells above,
# because a partial run would report every path the part it skipped reaches as
# unentered.  `src/error-paths-unentered.txt` records what this configuration
# does not reach today, and the run fails on anything new.
[testenv:errorpaths]
usedevelop = True
deps =
    {toxinidir}[test]
    -r{toxinidir}/numpy-requirements.txt
    coverage
commands =
    coverage erase
    coverage run -m pytest -q -m "not performance and not resources" tests/
    coverage combine
    python {toxinidir}/src/check_error_paths.py {posargs}
