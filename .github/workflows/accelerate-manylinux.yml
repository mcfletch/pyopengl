name: Build PyOpenGL-accelerate wheels with manylinux

# Both branches build the same set of distributions, and only master publishes
# them.  A push to develop leaves the sdists and wheels as run artifacts, so a
# release candidate can be downloaded and tested on each platform before
# anything reaches an index.

on:
  push:
    branches:
      - "master"
      - "develop"
  workflow_dispatch:

jobs:
  tarballs:
    name: Build source tarballs and root wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build
        run: >-
          python3 -m
          pip install
          build
          --user
      - name: Build a binary wheel and a source tarball for root
        run: >-
          python3 -m
          build
          --sdist
          --wheel
          --outdir dist/
          .
      - name: Build a source tarball for accelerate
        run: >-
          python3 -m
          build
          --sdist
          --outdir accelerate/dist
          accelerate

      - name: Save Core Distributions
        uses: actions/upload-artifact@v4
        with:
          name: core
          path: dist/*

      - name: Save Accelerate Distributions
        uses: actions/upload-artifact@v4
        with:
          name: accel
          path: accelerate/dist/*

  wheels:
    name: Build architecture-specific wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: "./accelerate"
          output-dir: "./accelerate/dist"
        env:
          CIBW_SKIP: "pp* cp36-* cp37-* cp38-*"
          # The C dispatch extension is optional in a source install, so that a
          # machine with no compiler still gets a working accelerate.  A
          # release is the other case: there the compiler is the point, and a
          # build that quietly dropped the extension would publish a wheel
          # without the thing it is for.  CIBW_ENVIRONMENT rather than the job
          # environment, which does not reach the Linux container.
          CIBW_ENVIRONMENT: "PYOPENGL_REQUIRE_C_DISPATCH=1"
          # Load the wheel that was just built.  Compiling is not the whole of
          # working: a missing symbol or a table the extension disagrees with
          # is a load-time failure, and without this the wheel would be
          # published having never been imported on the platform it is for.
          #
          # PyOpenGL goes into the test environment first, from the checkout,
          # because accelerate pins the exact version it pairs with and that
          # version is on no index until this run publishes it.  `before-test`
          # rather than `test-requires`: cibuildwheel installs test-requires
          # *after* the wheel, by which time pip has already gone looking for
          # the pin and found the newest release instead.
          CIBW_BEFORE_TEST: "pip install {project}"
          CIBW_TEST_COMMAND: >-
            python -c "import OpenGL_accelerate, OpenGL_accelerate.dispatch;
            import OpenGL._dispatch as d;
            print('accelerate', OpenGL_accelerate.__version__, 'dispatch', d.AVAILABLE);
            assert d.AVAILABLE, 'the dispatch extension did not load'"

      - name: Save wheels
        uses: actions/upload-artifact@v4
        with:
          name: accel-binary-${{ matrix.os }}
          path: accelerate/dist/*.whl

  # Whether there is anything to publish. Asked before the publish jobs rather
  # than left to PyPI to reject, so a push to master that does not bump the
  # version is an ordinary build rather than a failed upload.
  #
  # Both distributions are checked and either being new is enough: they are built
  # from one repository, carry one version, and `skip-existing` on the upload
  # takes care of the one that is already out.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        name: Are these versions already on PyPI?
        run: |
          VERSION=$(python -c "import re,pathlib,sys; t=pathlib.Path('OpenGL/version.py').read_text(); m=re.search(r'^__version__\s*=\s*[\'\"]([^\'\"]+)', t, re.M); sys.exit('no __version__ in OpenGL/version.py') if not m else print(m.group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PUBLISH=false
          for DIST in PyOpenGL PyOpenGL-accelerate; do
            # Only 200 and 404 are answers. Anything else -- a 5xx, a timeout, a
            # DNS failure -- means PyPI did not tell us, and guessing "not
            # published" would turn an outage into a failed upload against a
            # version that cannot be replaced.
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
                   "https://pypi.org/pypi/$DIST/$VERSION/json" || echo 000)
            case "$CODE" in
              200) echo "$DIST $VERSION is already on PyPI." ;;
              404) echo "$DIST $VERSION is not on PyPI; it will be published."; PUBLISH=true ;;
              *)   echo "PyPI answered HTTP $CODE for $DIST $VERSION; refusing to guess."; exit 1 ;;
            esac
          done
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  pypi-publish-accel:
    name: Upload Accelerate to PyPI
    runs-on: ubuntu-latest
    # Only a push to master publishes, and only a version that is not already
    # out; on develop, and on any manual run, the distributions stay as run
    # artifacts.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master'
            && needs.version.outputs.publish == 'true' }}
    needs:
      - version
      - wheels
      - tarballs
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Download Accelerate
        uses: actions/download-artifact@v4.1.7
        id: download-accelerate
        with:
          name: accel
          path: dist
      - name: Download Accelerate Binary Windows
        uses: actions/download-artifact@v4.1.7
        id: download-accelerate-bin-windows
        with:
          name: accel-binary-windows-latest
          path: dist
      - name: Download Accelerate Binary Ubuntu
        uses: actions/download-artifact@v4.1.7
        id: download-accelerate-bin-ubuntu
        with:
          name: accel-binary-ubuntu-latest
          path: dist
      - name: Download Accelerate Binary MacOS
        uses: actions/download-artifact@v4.1.7
        id: download-accelerate-bin-macOS
        with:
          name: accel-binary-macOS-latest
          path: dist

      # retrieve your distributions here
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The one project in the workspace still uploading with an API token.
          # To convert it, add a trusted publisher on PyPI for this repository
          # naming workflow `accelerate-manylinux.yml`, environment blank -- once
          # for `PyOpenGL` and once for `PyOpenGL-accelerate`, they being separate
          # projects there -- and then delete these two lines.
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          # A second net under the version job: a re-run of an already-published
          # commit is a no-op rather than a failure.
          skip-existing: true
          # Note: this is apparently different than the package-dir meaning in the cibuildwheel
          packages-dir: "dist"

  pypi-publish-core:
    name: Upload Core to PyPI
    runs-on: ubuntu-latest
    # Only a push to master publishes, and only a version that is not already
    # out; on develop, and on any manual run, the distributions stay as run
    # artifacts.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master'
            && needs.version.outputs.publish == 'true' }}
    needs:
      - version
      - wheels
      - tarballs
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Download Core
        uses: actions/download-artifact@v4.1.7
        id: download
        with:
          name: core
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        id: upload
        with:
          # The one project in the workspace still uploading with an API token.
          # To convert it, add a trusted publisher on PyPI for this repository
          # naming workflow `accelerate-manylinux.yml`, environment blank -- once
          # for `PyOpenGL` and once for `PyOpenGL-accelerate`, they being separate
          # projects there -- and then delete these two lines.
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          # A second net under the version job: a re-run of an already-published
          # commit is a no-op rather than a failure.
          skip-existing: true
          # Note: this is apparently different than the package-dir meaning in the cibuildwheel
          packages-dir: "dist"
