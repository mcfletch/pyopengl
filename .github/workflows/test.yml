name: Tests

# tox is how this project's suite is run -- it owns the interpreter matrix, the
# numpy / accelerate / dispatch axes and the variables a windowing backend needs
# (passenv). CI drives tox rather than pytest so that what runs here is what
# runs on a developer's machine, in a configuration the project already
# describes. A hand-rolled `pip install` here would be a second definition of
# the environment, and the one nobody else exercises.
#
# The renderer is Mesa's llvmpipe, reached headless through EGL's device
# platform (TEST_WINDOWING=egl): no X server, no GPU, and the same renderer on
# every run -- which is what makes a difference between runs mean something.
#
# GitHub's GPU runner is a larger runner, billed per minute on Team and
# Enterprise plans and never free whatever the repository's visibility, so no
# job here can use one.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      tests:
        description: >-
          What to run instead of the whole suite -- a path, or several.
          For iterating on one failure without waiting for the rest.
        default: ''
        required: false

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tox:
    name: ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The interpreter sweep, on the ordinary configuration: numpy present,
          # no compiled extension, ctypes entry points.
          - {python: '3.10', toxenv: py310-num1-accel0-dispctypes}
          - {python: '3.12', toxenv: py312-num1-accel0-dispctypes}
          - {python: '3.13', toxenv: py313-num1-accel0-dispctypes}
          - {python: '3.14', toxenv: py314-num1-accel0-dispctypes}
          # The compiled configuration: PyOpenGL_accelerate built, and the C
          # dispatch layer it carries actually selected.  conftest refuses this
          # combination if the extension did not build, so the axis cannot pass
          # while testing ctypes under another name.
          - {python: '3.12', toxenv: py312-num1-accel1-dispc}
          # Without numpy, which is an optional dependency and so a supported
          # way to have PyOpenGL installed.
          - {python: '3.12', toxenv: py312-num0-accel0-dispctypes}
    env:
      # The headless EGL-device backend, on the software device.  Both are read
      # by tests/glcontext_egl.py, and tox passes them through.
      TEST_WINDOWING: egl
      LIBGL_ALWAYS_SOFTWARE: '1'
      TEST_VISIBLE: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Mesa
        # libegl-mesa0 is the one that matters: it provides the EGL device
        # platform, and with it the software device the suite renders on.
        # libglu1-mesa and freeglut3-dev are separate libraries and not pulled
        # in by any of the others; without them the GLU suites, the legacy
        # fixture's own perspective, and the GLUT check scripts have nothing to
        # call.  The X libraries are for the glfw wheel, which links them
        # whether or not a display is ever opened.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1 libglx-mesa0 libgl1-mesa-dri \
            libglu1-mesa freeglut3-dev xvfb \
            libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6

      - name: Install tox
        run: python -m pip install --upgrade pip "tox" "tox-uv>=1"

      - name: Build the test environment
        # `tox exec` runs a command in an environment but does not build one --
        # it says so and carries on with the package missing -- so the
        # environment the report below runs in is made here.
        run: python -m tox -e ${{ matrix.toxenv }} --notest

      - name: Report the renderer under test
        # In the environment the tests will run in, so it is that PyOpenGL
        # being asked.  A suite that silently found no GL would skip its way to
        # green, so say what is about to render before anything runs.
        run: >
          python -m tox exec -e ${{ matrix.toxenv }} --
          python tests/check_egl_device_enumeration.py
        env:
          PYOPENGL_PLATFORM: egl

      - name: Run the tests
        # `not performance` is a claim about how fast something draws, and a CPU
        # rasteriser cannot answer one.  Nothing carries the marker yet; the
        # deselection is here so that the first test to need it is right.
        #
        # Under Xvfb because the GL suites reach their context through EGL and
        # need no display, but the stand-alone check scripts open a window and
        # skip where they cannot -- twenty of them, which is a green run that
        # exercised no windowing at all.  `-a` picks a free server number.
        run: >
          xvfb-run -a
          python -m tox -e ${{ matrix.toxenv }} --
          ${{ inputs.tests || 'tests/' }} -m "not performance"

  macos:
    name: macOS ${{ matrix.os }} / CGL / ${{ matrix.toxenv }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
        # Both implementations, because the compiled one is the release's
        # substance and Linux is otherwise the only platform it is ever run on.
        # The wheel job compiles it for macOS already; nothing there loads what
        # it built, and a wrong table or a missing symbol is a load-time
        # failure.  CGL needs no window server for either.
        toxenv:
          - py312-num1-accel0-dispctypes
          - py312-num1-accel1-dispc
    env:
      # CGL, not GLFW: GLFW's NSGL path asks for an accelerated pixel format
      # unconditionally, and these runners have no accelerated renderer to give
      # -- so no GLFW context can be created on one at all.  CGL is the layer
      # underneath and will hand out a context with no window server.
      TEST_WINDOWING: cgl
      TEST_VISIBLE: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tox
        run: python -m pip install --upgrade pip "tox" "tox-uv>=1"

      - name: Build the test environment
        # `tox exec` runs a command in an environment but does not build one --
        # it says so and carries on with the package missing -- so the
        # environment the report below runs in is made here.
        run: python -m tox -e ${{ matrix.toxenv }} --notest

      - name: Report the renderer under test
        # In the environment the tests will run in, and non-zero where no
        # context can be made: a suite that found no GL would skip its way to
        # green having rendered nothing, which reads the same as a pass.
        run: >
          python -m tox exec -e ${{ matrix.toxenv }} --
          python tests/check_cgl_context.py

      # One area per step, each allowed to fail, because a segfault ends the
      # process it happens in: run as one command and the first crash costs
      # every test after it, so a machine none of us can log into becomes one
      # crash per push to learn about.  The gate below is what fails the job.
      - name: Run the tests -- root
        id: root
        continue-on-error: true
        run: >
          python -m tox -e ${{ matrix.toxenv }} --
          ${{ inputs.tests || 'tests/ --ignore=tests/gl --ignore=tests/glu --ignore=tests/gles --ignore=tests/cdispatch' }}
          -m "not performance"

      - name: Run the tests -- cdispatch
        id: cdispatch
        if: inputs.tests == ''
        continue-on-error: true
        run: python -m tox -e ${{ matrix.toxenv }} -- tests/cdispatch -m "not performance"

      - name: Run the tests -- gl
        id: gl
        if: inputs.tests == ''
        continue-on-error: true
        run: python -m tox -e ${{ matrix.toxenv }} -- tests/gl -m "not performance"

      - name: Run the tests -- glu
        id: glu
        if: inputs.tests == ''
        continue-on-error: true
        run: python -m tox -e ${{ matrix.toxenv }} -- tests/glu -m "not performance"

      - name: Run the tests -- gles
        id: gles
        if: inputs.tests == ''
        continue-on-error: true
        run: python -m tox -e ${{ matrix.toxenv }} -- tests/gles -m "not performance"

      # A crash on a machine none of us can log into is only as debuggable as
      # what the run took away with it.  faulthandler prints the Python frame;
      # the faulting native frame -- driver, library, offset -- is in the
      # crash report macOS writes, so collect it here while it still exists.
      - name: Collect crash reports
        if: always()
        run: |
          # The runner is fresh, so everything in these directories belongs to
          # this run.
          mkdir -p crash-reports
          for dir in "$HOME/Library/Logs/DiagnosticReports" \
                     /Library/Logs/DiagnosticReports; do
            [ -d "$dir" ] || continue
            find "$dir" -name '*.ips' -exec cp {} crash-reports/ \; || true
          done
          if [ -z "$(ls -A crash-reports 2>/dev/null)" ]; then
            echo 'no crash report was written'
          else
            for report in crash-reports/*; do
              echo "::group::$report"
              cat "$report"
              echo '::endgroup::'
            done
          fi

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports-${{ matrix.os }}-${{ matrix.toxenv }}
          path: crash-reports/
          if-no-files-found: ignore

      - name: Fail the job if any area did
        if: always()
        run: |
          printf 'root       %s\n' '${{ steps.root.outcome }}'
          printf 'cdispatch  %s\n' '${{ steps.cdispatch.outcome }}'
          printf 'gl         %s\n' '${{ steps.gl.outcome }}'
          printf 'glu        %s\n' '${{ steps.glu.outcome }}'
          printf 'gles       %s\n' '${{ steps.gles.outcome }}'
          for outcome in '${{ steps.root.outcome }}' '${{ steps.cdispatch.outcome }}' \
                         '${{ steps.gl.outcome }}' '${{ steps.glu.outcome }}' \
                         '${{ steps.gles.outcome }}'; do
            case "$outcome" in
              success|skipped) ;;
              *) echo "::error::an area did not pass: $outcome"; exit 1 ;;
            esac
          done
