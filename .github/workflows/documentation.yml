name: Documentation

# Build the documentation set and put it on `gh-pages`, which is what GitHub
# Pages serves.
#
# `master` is what is released, so that is what the published documentation
# describes.  Work lands on `develop` and is documented from a checkout; only a
# release moves the site.
#
# The site is about a hundred megabytes of HTML.  It is published as a single
# commit with no parent, replacing the branch rather than adding to it, so the
# repository carries one copy of it however many releases there are -- see
# `build-docs.py` and `plans/SPHINX-DOCS.md`.  That means a force push, which
# is why this job has `contents: write` and why nothing else should write to
# that branch.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Whether to put the result on gh-pages. Off by default on a manual
          run, which is then a build that says whether the set still builds.
        type: boolean
        default: false

# One at a time.  Two builds racing would each force the branch over the
# other's, and the lease in `build-docs.py` would turn the loser into a failed
# job rather than a lost site -- but not queueing them is simpler than
# explaining that failure.
concurrency:
  group: documentation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    # Three thousand pages through Sphinx, on a four-core runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the libraries the packages bind to
        # The pages are written by importing every module, and a module whose
        # library is absent cannot be imported and gets no page.  The same set
        # the test workflow installs, for the same reason.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1 libglx-mesa0 libgl1-mesa-dri \
            libglu1-mesa libosmesa6 freeglut3-dev \
            libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6

      - name: Install PyOpenGL and the documentation tools
        # Both distributions, as the project's own instructions say: the
        # accelerators are a package of their own and get pages of their own.
        # Editable, so what is documented is this checkout.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]" ./accelerate

      - name: Name the commits this job makes
        # `git commit-tree` wants an author and a committer, and a runner has
        # neither configured.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build the set
        # `--publish` without `--push` on a manual run that did not ask for it:
        # the build is the thing being checked, and the branch is left alone.
        run: |
          python build-docs.py \
            --stage site \
            ${{ (github.event_name == 'push' || inputs.publish) && '--publish --push origin' || '' }}

      - name: Keep the built site with the run
        # So a build that was not published can still be looked at, and so a
        # published one can be compared against what is on the branch.
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site
          retention-days: 14
