name: Khronos registry update

# Pull the registry, regenerate the C dispatch layer, and say what changed.
#
# The registry gains entry points and enums continuously, and a gap in the
# bindings is otherwise only noticed when somebody tries to call the thing that
# is missing.  This runs weekly, opens a pull request when the regeneration
# produces a diff, and puts the report in the body so the change can be read
# without checking anything out.

on:
  schedule:
    # Weekly, early Monday. The registry moves in weeks, not hours.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate from the registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the generator's dependencies
        run: python -m pip install lxml

      - name: Fetch the Khronos registry
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenGL-Registry.git \
            src/khronosapi
          echo "REGISTRY_COMMIT=$(git -C src/khronosapi rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report what differs before regenerating
        id: before
        run: |
          {
            echo 'report<<REPORT_EOF'
            python src/check_registry.py --verbose || true
            echo REPORT_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate the C dispatch layer
        run: python src/regenerate_c.py

      - name: Fail on drift nobody has looked at
        # Exits non-zero only for what registry_baseline.json does not already
        # record, so the run is quiet until the registry actually adds
        # something.
        run: python src/check_registry.py --new-only

      - name: Open a pull request when the regeneration changed anything
        uses: peter-evans/create-pull-request@v6
        with:
          branch: registry-update
          title: "REGISTRY Regenerate from Khronos ${{ env.REGISTRY_COMMIT }}"
          commit-message: |
            REGISTRY Regenerate the C dispatch layer

            From KhronosGroup/OpenGL-Registry ${{ env.REGISTRY_COMMIT }}.
          body: |
            Regenerated by `src/regenerate_c.py` from Khronos registry
            `${{ env.REGISTRY_COMMIT }}`.

            What the shipped bindings and the registry differ about:

            ```
            ${{ steps.before.outputs.report }}
            ```

            An entry point whose generated body is not a plain macro expansion
            is the one thing here that needs a person; everything else is
            table data.
          add-paths: |
            src/c/generated
            src/cdispatch/registry_baseline.json
            OpenGL/_dispatch/_tables.py
            OpenGL/*/__init__.pyi
